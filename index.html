
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Mamma ❤️</title>
    
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        background: #2b1b12;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .parchment {
        position: relative;
        width: 100%;
        max-width: 800px;
        min-height: 85vh;
        padding: 50px 35px;
        background-color: #e8d4ad;
        background-image: url("parchment.png");
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;

         box-shadow:
        0 0 25px rgba(0, 0, 0, 0.7),
        inset 0 0 45px rgba(91, 49, 20, 0.45);
        }
    
    /* ===== VINTAGE BOTANICAL DECORATION ===== */

    .botanical {
        position: absolute;
        top: 25px;
        left: 25px;
        width: 130px;
        height: 160px;
        pointer-events: none;
    }

    .botanical::before {
        content: "";
        position: absolute;
        width: 2px;
        height: 125px;
        top: 15px;
        left: 55px;
        background: #737b4b;
        border-radius: 50%;
        transform: rotate(-25deg);
        transform-origin: top center;
    }

    .botanical::after {
        content: "";
        position: absolute;
        top: 40px;
        left: 30px;
        width: 22px;
        height: 11px;
        background: #737b4b;
        border-radius: 100% 0 100% 0;
        transform: rotate(-25deg);
    }

    .leaf-second {
        position: absolute;
        top: 60px;
        left: 48px;
        width: 22px;
        height: 11px;
        background: #737b4b;
        border-radius: 0 100% 0 100%;
        transform: rotate(20deg);
    }

    .leaf-third {
        position: absolute;
        top: 82px;
        left: 58px;
        width: 20px;
        height: 10px;
        background: #737b4b;
        border-radius: 100% 0 100% 0;
        transform: rotate(-35deg);
    }

    .flower-bud {
        position: absolute;
        top: 8px;
        left: 48px;
        width: 10px;
        height: 10px;
        background: #a5a16c;
        border-radius: 50%;
    }

    .flower-bud::before {
        content: "";
        position: absolute;
        width: 8px;
        height: 12px;
        top: -9px;
        left: -4px;
        background: #b8b083;
        border-radius: 50%;
        transform: rotate(-30deg);
    }

    .flower-bud::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 12px;
        top: -7px;
        left: 9px;
        background: #b8b083;
        border-radius: 50%;
        transform: rotate(45deg);
    }

    .flower-petal-third {
        position: absolute;
        width: 7px;
        height: 10px;
        top: -8px;
        left: 7px;
        background: #c4bc91;
        border-radius: 50%;
        transform: rotate(90deg);
    }

    .flower-petal-fourth {
        position: absolute;
        width: 6px;
        height: 9px;
        top: 1px;
        left: -8px;
        background: #b8b083;
        border-radius: 50%;
        transform: rotate(-55deg);
    }


  

</style>

</head>
<body>

 <main class="parchment">

  


<div class="botanical">
    <div class="leaf-second"></div>
    <div class="leaf-third"></div>
    
<div class="flower-bud">
    <div class="flower-petal-third"></div>
    <div class="flower-petal-fourth"></div>
</div>
</div>



</main>

</body>
</html>
